<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Required | MergePoint</title>
    <link rel="stylesheet" href="redirect.css">
    <link rel="icon" type="image/png" href="assets/favicon.png?v=1.1">
</head>
<body>
    <div class="redirect-container">
        <div class="card">
            <div class="icon-box">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="warning-icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <h1>Account Paused</h1>
            <p>Your subscription has ended or a payment failed. To protect your data, access to your bids and knowledge base has been temporarily restricted.</p>
            
            <div class="actions">
                <button id="portal-btn" class="btn-primary">Update Payment Method</button>
                <button id="logout-btn" class="btn-secondary">Log Out</button>
            </div>
            
            <p class="footer-note">Once updated, your access will be restored automatically.</p>
        </div>
    </div>

    <script type="module" src="redirect.js"></script>
</body>
</html>
